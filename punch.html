<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0D0D27">
<title>Attendance — Lintel People</title>
<style>
  body{margin:0;background:#F4EFE6;font-family:-apple-system,'Inter',Arial,sans-serif;color:#0D0D27}
  .wrap{max-width:420px;margin:0 auto;padding:34px 20px}
  .card{background:#fff;border:1px solid #DDD3C1;border-radius:16px;padding:28px 24px;text-align:center}
  h1{font-family:Georgia,serif;font-size:22px;font-weight:600;margin:0}
  #status{color:#565571;font-size:14px;margin:6px 0 22px}
  #selfieWrap{display:block;border:1.5px dashed #CFC4AD;border-radius:12px;padding:16px;margin-bottom:14px;cursor:pointer}
  #selfiePrev{display:none;width:96px;height:96px;border-radius:50%;object-fit:cover;margin:0 auto 8px}
  #go{width:100%;padding:16px;font-size:16px;font-weight:700;border:none;border-radius:12px;background:#DFB05E;color:#0D0D27;font-family:inherit;cursor:pointer}
  #siteGo{display:none;width:100%;margin-top:10px;padding:13px;font-size:14px;font-weight:600;border:1px solid #CFC4AD;border-radius:12px;background:#fff;color:#0D0D27;font-family:inherit;cursor:pointer}
  #err{display:none;background:#F4E5E0;color:#A4503E;font-size:13px;padding:10px 12px;border-radius:8px;margin-top:12px;text-align:left}
  .hint{color:#8a8875;font-size:11.5px;margin-top:14px}
  #done{display:none}
  .foot{text-align:center;color:#8a8875;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1 id="hello">Attendance</h1>
    <div id="status">Loading…</div>
    <div id="flow" style="display:none">
      <label id="selfieWrap">
        <img id="selfiePrev" alt=""/>
        <div style="font-size:26px">🤳</div>
        <div id="selfieLbl" style="font-size:13.5px;font-weight:600">Take a selfie</div>
        <input id="selfie" type="file" accept="image/*" capture="user" style="display:none"/>
      </label>
      <button id="go"></button>
      <button id="siteGo" data-action="in">📍 Arrived somewhere new? Check in here</button>
      <div id="err"></div>
      <div class="hint">📍 GPS verified · shift 9:30 AM – 6:30 PM · works at the studio and any mapped project site</div>
    </div>
    <div id="done">
      <div style="font-size:44px;margin:6px 0">✅</div>
      <div id="doneMsg" style="font-weight:700;font-size:16px"></div>
      <div id="doneSub" style="color:#565571;font-size:13px;margin-top:6px"></div>
    </div>
  </div>
  <div class="foot">Lintel Space Atelier · Lintel People</div>
</div>
<script>
var FN = "https://cxgxmqspvpuizvwfbnjq.supabase.co/functions/v1/punch";
var q = new URLSearchParams(location.search);
var E = q.get("e") || "", T = q.get("t") || "";
var selfieData = null, ACTION = "in", SELFIE_REQ = true;

function $(id){ return document.getElementById(id); }
function err(m){ var e=$("err"); e.textContent=m; e.style.display="block"; }
function post(body){
  return fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(Object.assign({ e:E, t:T }, body)) }).then(function(r){ return r.json(); });
}

function renderState(d){
  $("hello").textContent = "Hi " + d.first_name + " 👋";
  $("status").textContent = d.status_line;
  ACTION = d.action;
  SELFIE_REQ = d.action === "in";
  $("go").textContent = d.btn_label;
  $("go").setAttribute("data-action", d.action);
  $("selfieLbl").textContent = "Take a selfie " + (SELFIE_REQ ? "(required)" : "(optional)");
  $("siteGo").style.display = d.show_site_btn ? "block" : "none";
  $("flow").style.display = "block";
}

if (!E || !T) {
  $("status").textContent = "This attendance link isn’t valid. Message Priya “In” on WhatsApp to get a fresh one.";
} else {
  post({ action:"state" }).then(function(d){
    if (!d.ok) { $("status").textContent = d.error || "This link isn’t valid — message Priya “In” for a fresh one."; return; }
    renderState(d);
  }).catch(function(){ $("status").textContent = "Couldn’t load — check your connection and reopen the link."; });
}

var inp = $("selfie");
$("selfieWrap").onclick = function(ev){ if (ev.target !== inp) { ev.preventDefault(); inp.click(); } };
inp.onchange = function(){
  var f = inp.files[0]; if (!f) return;
  var img = new Image(); var url = URL.createObjectURL(f);
  img.onload = function(){
    var s = Math.min(1, 720 / Math.max(img.width, img.height));
    var c = document.createElement("canvas"); c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    selfieData = c.toDataURL("image/jpeg", 0.72);
    var p = $("selfiePrev"); p.src = selfieData; p.style.display = "block";
    $("selfieLbl").textContent = "Selfie added ✓ (tap to retake)";
    URL.revokeObjectURL(url);
  };
  img.src = url;
};

function go(btn){
  var action = btn.getAttribute("data-action");
  $("err").style.display = "none";
  if (action === "in" && !selfieData) return err("Please take a selfie first — tap the box above.");
  var orig = btn.textContent;
  btn.disabled = true; btn.textContent = "Getting your location…";
  navigator.geolocation.getCurrentPosition(function(pos){
    btn.textContent = "Recording…";
    post({ action:action, lat:pos.coords.latitude, lng:pos.coords.longitude, selfie:selfieData })
    .then(function(d){
      if (!d.ok) { btn.disabled=false; btn.textContent=orig; return err(d.error || "Something went wrong."); }
      $("flow").style.display = "none";
      $("done").style.display = "block";
      $("doneMsg").textContent = d.headline;
      $("doneSub").textContent = d.sub || "";
      $("status").textContent = "Recorded ✓";
    })
    .catch(function(){ btn.disabled=false; btn.textContent="Try again"; err("Network hiccup — try again."); });
  }, function(){
    btn.disabled = false; btn.textContent = orig;
    err("Location is required — allow location access for this page and try again.");
  }, { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
}
$("go").onclick = function(){ go(this); };
$("siteGo").onclick = function(){ go(this); };
</script>
</body>
</html>
